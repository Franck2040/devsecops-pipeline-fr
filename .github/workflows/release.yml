name: Release (SBOM generation)

# Workflow declenche sur publication d'une release GitHub.
# Genere les SBOM CycloneDX et SPDX et les attache automatiquement
# comme assets de la release.
#
# Test manuel : gh workflow run release.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # pour attacher SBOM comme assets de release
  actions: read

jobs:

  layer6-sbom:
    name: "Layer 6 - SBOM (Syft CycloneDX + SPDX)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: ./.github/actions/sbom
