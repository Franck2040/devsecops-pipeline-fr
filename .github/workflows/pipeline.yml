name: DevSecOps Pipeline

# Workflow d'orchestration des 7 couches de scan.
# Etat au phase 5 : 5 couches sur 7 actives.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # necessaire pour upload SARIF vers GitHub Security
  actions: read

jobs:

  layer1-secrets:
    name: "Layer 1 - Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets
        uses: ./.github/actions/secrets
        with:
          config-path: '.gitleaks.toml'
          fail-on-finding: 'true'

  layer2-sast:
    name: "Layer 2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan SAST
        uses: ./.github/actions/sast

  layer3-sca:
    name: "Layer 3 - SCA (Trivy FS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan SCA
        uses: ./.github/actions/sca

  layer4-iac:
    name: "Layer 4 - IaC (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan IaC
        uses: ./.github/actions/iac
        with:
          directory: '.'
          framework: 'dockerfile,github_actions,secrets'

  layer5-container:
    name: "Layer 5 - Container (Trivy image)"
    runs-on: ubuntu-latest
    # Build necessite que les fichiers soient checkout, mais pas de dep
    # sur les layers precedents (parallelisation = pipeline plus rapide).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan container
        uses: ./.github/actions/container

  # TODO ajout au fil des phases :
  #   layer6-sbom        (Syft CycloneDX, sur release)
  #   layer7-dast        (OWASP ZAP, nightly)
