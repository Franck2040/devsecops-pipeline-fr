name: 'DevSecOps - SCA (Trivy FS + npm audit)'
description: 'Software Composition Analysis : scan des dependances Node via Trivy FS (action officielle Aqua) et npm audit.'
author: 'Calixte Franck Kenmeugne'

inputs:
  scan-path:
    description: "Chemin a scanner (relatif a la racine du repo)"
    required: false
    default: '.'
  app-dir:
    description: "Sous-dossier de l'app Node pour npm audit"
    required: false
    default: 'app'
  trivy-severity:
    description: "Niveaux de severite a reporter (Trivy)"
    required: false
    default: 'CRITICAL,HIGH,MEDIUM'
  fail-on-finding:
    description: "Faire echouer le job si findings (true/false)"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # ----------------------------------------------------------------
    # Etape 1 : Trivy via l'action officielle Aqua
    # ----------------------------------------------------------------
    # On pin sur 0.36.0 (derniere stable verifiee).
    # L'action gere l'install, le cache binaire, et evite la rate limit
    # API GitHub. C'est le standard de l'industrie.
    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@0.36.0
      with:
        scan-type: 'fs'
        scan-ref: ${{ inputs.scan-path }}
        format: 'json'
        output: 'trivy-sca-report.json'
        severity: ${{ inputs.trivy-severity }}
        exit-code: '0'
        ignore-unfixed: 'false'

    # ----------------------------------------------------------------
    # Etape 2 : annotation lisible dans l'UI GitHub
    # ----------------------------------------------------------------
    - name: Annoter les findings Trivy
      shell: bash
      run: |
        if [ ! -f trivy-sca-report.json ]; then
          echo "::warning::Rapport Trivy absent, l'etape precedente a peut-etre echoue."
          exit 0
        fi

        # Si jq n'est pas dispo, l'annotation est best-effort
        if ! command -v jq >/dev/null 2>&1; then
          echo "::notice::Rapport Trivy genere (jq absent, decompte saute)."
          exit 0
        fi

        COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-sca-report.json)
        if [ "$COUNT" -gt 0 ]; then
          echo "::warning::Trivy a detecte $COUNT vulnerabilites dans les dependances."
        else
          echo "::notice::Aucune vulnerabilite Trivy detectee."
        fi

        if [ "${{ inputs.fail-on-finding }}" = "true" ] && [ "$COUNT" -gt 0 ]; then
          echo "::error::fail-on-finding active, on echoue volontairement."
          exit 1
        fi

    # ----------------------------------------------------------------
    # Etape 3 : npm audit en complement (vue 'npm-native')
    # ----------------------------------------------------------------
    - name: npm audit
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      run: |
        set +e
        npm audit --json > ../npm-audit-report.json 2>/dev/null
        EXIT_CODE=$?

        if [ -f ../npm-audit-report.json ]; then
          if command -v jq >/dev/null 2>&1; then
            VULNS=$(jq '.metadata.vulnerabilities.total // 0' ../npm-audit-report.json 2>/dev/null || echo 0)
            if [ "$VULNS" -gt 0 ]; then
              echo "::warning::npm audit a detecte $VULNS vulnerabilites."
            else
              echo "::notice::npm audit : aucune vulnerabilite."
            fi
          else
            echo "::notice::npm audit termine (jq absent, decompte saute)."
          fi
        else
          echo "::warning::npm audit n'a pas genere de rapport (exit=$EXIT_CODE)."
        fi

        # On ne plante pas la CI sur npm audit (geste pedagogique : Trivy est l'autorite)
        exit 0

    # ----------------------------------------------------------------
    # Etape 4 : upload des artefacts pour audit hors-ligne
    # ----------------------------------------------------------------
    - name: Upload SCA reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sca-reports
        path: |
          trivy-sca-report.json
          npm-audit-report.json
        retention-days: 30
        if-no-files-found: warn
