name: 'DevSecOps - Scan secrets'
description: 'Scanne le repo pour secrets hardcodes via Gitleaks. Wrapper standardise reutilisable.'
author: 'Calixte Franck Kenmeugne'

inputs:
  config-path:
    description: "Chemin du fichier de configuration Gitleaks"
    required: false
    default: '.gitleaks.toml'
  gitleaks-version:
    description: "Version de Gitleaks a installer"
    required: false
    default: '8.21.2'
  upload-artifact:
    description: "Upload du rapport JSON en artifact (true/false)"
    required: false
    default: 'true'
  fail-on-finding:
    description: "Faire echouer le job si findings non exemptes (true/false)"
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install Gitleaks
      shell: bash
      run: |
        VERSION="${{ inputs.gitleaks-version }}"
        echo "Installing Gitleaks v${VERSION}..."
        curl -sLo /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Scan repository
      shell: bash
      id: scan
      run: |
        set +e
        gitleaks detect \
          --source=. \
          --config="${{ inputs.config-path }}" \
          --report-format=json \
          --report-path=gitleaks-report.json \
          --verbose \
          --redact
        EXIT_CODE=$?
        echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "::notice::Aucun secret non exempte detecte."
        elif [ "$EXIT_CODE" -eq 1 ]; then
          echo "::warning::Gitleaks a trouve des secrets non exemptes."
          if [ "${{ inputs.fail-on-finding }}" = "true" ]; then
            exit 1
          fi
        else
          echo "::error::Gitleaks a renvoye un code d'erreur inattendu : ${EXIT_CODE}"
          exit "$EXIT_CODE"
        fi

    - name: Upload report
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: gitleaks-report.json
        retention-days: 30
        if-no-files-found: warn
